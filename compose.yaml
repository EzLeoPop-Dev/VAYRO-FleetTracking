name: vayro-fleettracking

x-healthcheck: &healthcheck
  test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/'); if (!r.ok) process.exit(1)"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 45s

# Every service that owns data has its own database and login role on this one Postgres server; none can read
# another's data. Services call each other over HTTP (/internal/*) with INTERNAL_API_TOKEN instead.
x-internal: &internal
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?copy .env.example to .env}

services:
  web:
    build:
      context: .
      target: web
    environment:
      API_URL: http://gateway:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vayro
      POSTGRES_USER: vayro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs on a new volume only: creates one database + role per service. For an existing volume see docs/DATABASE.md.
      - ./infra/database/init:/docker-entrypoint-initdb.d:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vayro -d vayro"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 1. Authentication. Owns: auth_sessions. Signs tokens and tells other services who a caller is.
  auth-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/auth-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://auth_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      USER_SERVICE_URL: http://user-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_PORT:-3002}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 2. Company. Owns: company. Registration and workspace status.
  company-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/company-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://company_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/company_db
      AUTH_SERVICE_URL: http://auth-service:3000
      USER_SERVICE_URL: http://user-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 3. User. Owns: users. Accounts and roles; checks passwords for auth-service.
  user-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/user-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://user_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/user_db
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${USER_PORT:-3003}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 4. Vehicle. Owns: vehicle_types, vehicles. Internal lookups only for now (no public API yet).
  vehicle-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/vehicle-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://vehicle_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/vehicle_db
      AUTH_SERVICE_URL: http://auth-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 5. GPS Device. Owns: gps_devices.
  gps-device-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/gps-device-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://gps_device_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/gps_device_db
      # Optional. Without it the service runs, but saving provider credentials is refused (503).
      CREDENTIALS_ENCRYPTION_KEY: "${CREDENTIALS_ENCRYPTION_KEY:-}"
      AUTH_SERVICE_URL: http://auth-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 6. GPS Data. Owns: gps_locations. Ingest and stored positions.
  gps-data-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/gps-data-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://gps_data_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/gps_data_db
      TRACKING_API_TOKENS: "${TRACKING_API_TOKENS:-}"
      # Optional, comma separated base URLs of services that want every new point pushed (e.g. http://alert-service:3000).
      GPS_EVENT_SUBSCRIBERS: "${GPS_EVENT_SUBSCRIBERS:-}"
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      company-service:
        condition: service_healthy
      vehicle-service:
        condition: service_healthy
      gps-device-service:
        condition: service_healthy
      transport-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRACKING_PORT:-3004}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 7. Vehicle Tracking. No database; skeleton (no routes yet).
  tracking-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/tracking-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 8. Route History. No database; skeleton (no routes yet).
  route-history-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/route-history-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 9. Transport Job. Owns: transport_jobs. Internal lookups only for now (no public API yet).
  transport-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/transport-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://transport_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/transport_db
      AUTH_SERVICE_URL: http://auth-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 10. Alert & Geofence. Owns: alert_rules, geofences, alerts. Skeleton (no routes yet).
  alert-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/alert-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://alert_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/alert_db
      AUTH_SERVICE_URL: http://auth-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      USER_SERVICE_URL: http://user-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 11. Reporting & Dashboard. No database; skeleton (no routes yet).
  reporting-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/reporting-service
    environment:
      <<: *internal
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      USER_SERVICE_URL: http://user-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      ALERT_SERVICE_URL: http://alert-service:3000
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  # 12. Integration & Logging. Owns: api_integrations, api_request_logs, system_log. Skeleton (no routes yet).
  integration-service:
    build:
      context: .
      target: api
      args:
        SERVICE: services/integration-service
    environment:
      <<: *internal
      DATABASE_URL: postgres://integration_svc:${POSTGRES_PASSWORD:?copy .env.example to .env}@postgres:5432/integration_db
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

  gateway:
    build:
      context: .
      target: api
      args:
        SERVICE: gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:3000
      COMPANY_SERVICE_URL: http://company-service:3000
      USER_SERVICE_URL: http://user-service:3000
      VEHICLE_SERVICE_URL: http://vehicle-service:3000
      GPS_DEVICE_SERVICE_URL: http://gps-device-service:3000
      GPS_DATA_SERVICE_URL: http://gps-data-service:3000
      TRACKING_SERVICE_URL: http://tracking-service:3000
      ROUTE_HISTORY_SERVICE_URL: http://route-history-service:3000
      TRANSPORT_SERVICE_URL: http://transport-service:3000
      ALERT_SERVICE_URL: http://alert-service:3000
      REPORTING_SERVICE_URL: http://reporting-service:3000
      INTEGRATION_SERVICE_URL: http://integration-service:3000
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3001}:3000"
    init: true
    restart: unless-stopped
    healthcheck: *healthcheck

volumes:
  pgdata:
